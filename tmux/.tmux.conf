# .tmux.conf
# Modern Tmux Configuration for macOS

# 1. Core Settings
set -g default-terminal "screen-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# 2. Key Bindings (macOS friendly)
# Remap prefix to Ctrl-a (optional, keep C-b for now standard)
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Reload config
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# 3. Clipboard Integration (cross-platform)
set -g set-clipboard on
bind-key -T copy-mode-vi v send-keys -X begin-selection
# macOS: pbcopy, Linux: xclip
if-shell "uname | grep -q Darwin" \
    "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'; \
     bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'" \
    "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard'; \
     bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard'"

# 4. Status Bar (GitHub macOS Dark styled)
set -g status-position top
set -g status-style 'bg=#0d1117 fg=#c9d1d9'
set -g status-left ' #[fg=#0d1117,bg=#58a6ff,bold] #{?#{!=:#{@claw_session},},#{@claw_session},#S} #[default] '
set -g status-right '#[fg=#c9d1d9,bg=#161b22] %Y-%m-%d #[fg=#c9d1d9,bg=#21262d] %H:%M '
set -g status-right-length 50
set -g status-left-length 32

setw -g window-status-current-style 'fg=#0d1117 bg=#58a6ff bold'
setw -g window-status-current-format ' #I#[fg=#161b22]:#[fg=#0d1117]#W#[fg=#0d1117]#F '

setw -g window-status-style 'fg=#8b949e bg=#161b22'
setw -g window-status-format ' #I#[fg=#21262d]:#[fg=#8b949e]#W#[fg=#8b949e]#F '

# 5. Panes
set -g pane-border-style 'fg=#161b22'
set -g pane-active-border-style 'fg=#58a6ff'

# 6. Plugins (TPM)
# Install TPM once:  git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# then reload (prefix+r) and press prefix+I to fetch the plugins below.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # save/restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'   # auto-save + auto-restore (keep LAST)

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Only init TPM when it's actually installed, so the config stays valid on hosts
# without it. Keep this as the very last line.
if "test -d ~/.tmux/plugins/tpm" "run '~/.tmux/plugins/tpm/tpm'"
