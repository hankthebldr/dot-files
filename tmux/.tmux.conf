# .tmux.conf
# Modern Tmux Configuration for macOS

# 1. Core Settings
set -g default-terminal "screen-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# 2. Key Bindings (macOS friendly)
# Remap prefix to Ctrl-a (optional, keep C-b for now standard)
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Reload config
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# 3. macOS Clipboard Integration
set -g set-clipboard on
# Use pbcopy for copy
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# 4. Status Bar (Minimalist / Gruvbox styled)
set -g status-position top
set -g status-style 'bg=#282828 fg=#ebdbb2'
set -g status-left ''
set -g status-right '#[fg=#ebdbb2,bg=#3c3836] %Y-%m-%d #[fg=#ebdbb2,bg=#504945] %H:%M '
set -g status-right-length 50
set -g status-left-length 20

setw -g window-status-current-style 'fg=#282828 bg=#fabd2f bold'
setw -g window-status-current-format ' #I#[fg=#3c3836]:#[fg=#282828]#W#[fg=#282828]#F '

setw -g window-status-style 'fg=#a89984 bg=#3c3836'
setw -g window-status-format ' #I#[fg=#504945]:#[fg=#a89984]#W#[fg=#a89984]#F '

# 5. Panes
set -g pane-border-style 'fg=#3c3836'
set -g pane-active-border-style 'fg=#fabd2f'

# 6. Plugins (TPM)
# set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-sensible'
# run '~/.tmux/plugins/tpm/tpm'
