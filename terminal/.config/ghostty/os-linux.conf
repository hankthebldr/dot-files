# Ghostty — Linux / GTK (GNOME) layer.
# Loaded via `config-file = ?os-active.conf`, where os-active.conf is a symlink
# → this file, set by scripts/setup/symlinks.sh on Linux hosts. These are
# GTK-only knobs and Linux-terminal muscle-memory fallbacks — inert or rejected
# on macOS, so they live out of the shared base config.

# ── Font weight ───────────────────────────────────────────────────────
# macOS uses font-thicken; on the GTK/freetype build heavier strokes come from
# freetype-load-flags instead. Left commented (unvalidated on this checkout) —
# uncomment on the Linux box if JetBrainsMono renders too thin:
# freetype-load-flags = hinting,force-autohint,autohint

# ── GTK window chrome ─────────────────────────────────────────────────
# Give the GTK frame + titlebar back so the window has a border and can be
# dragged/resized on GNOME (pairs with cross-platform window-decoration = true).
gtk-titlebar = true
gtk-tabs-location = top
gtk-wide-tabs = false
# Working directory in the headerbar subtitle, under the title. GTK-only
# (Ghostty >= 1.1.0), which is why it lives here and not in the shared base.
# Ghostty derives it from the shell-integration OSC 7 cwd report, so it stays
# correct through `cd` without the shell repainting anything — independent of
# the OSC 0 title progress.zsh owns. Belt and braces: the tab text leads with
# the cwd (progress.zsh) AND the window says it outright.
window-subtitle = working-directory
# Reuse one GTK process so new windows open instantly and share memory. Ghostty
# autodetects this but it's unreliable for non-GNOME-launched windows, and the
# launch dashboard makes cold starts costly — force it on.
gtk-single-instance = true

# ── Appearance ────────────────────────────────────────────────────────
# background-blur is KDE Plasma-only; GNOME/Mutter silently ignores it. Left
# off so we don't imply a glass effect that never renders. Uncomment on KDE:
# background-blur = 20

# ── Keybindings (Linux safety) ────────────────────────────────────────
# Also accept the standard Ctrl+Shift+C/V so muscle memory from other Linux
# terminals still works alongside the cross-platform Super-key binds.
keybind = ctrl+shift+c=copy_to_clipboard
keybind = ctrl+shift+v=paste_from_clipboard
