# Ghostty — macOS-only layer.
# Loaded via `config-file = ?os-active.conf`, where os-active.conf is a symlink
# → this file, set by scripts/setup/symlinks.sh on Darwin hosts. Everything
# here is rejected or a no-op on the GTK/Linux build, which is exactly why it's
# quarantined out of the shared base config.
# Tuned for the MBP (operator pass 2026-08-17): 13pt Retina type, glass
# restored, fast fullscreen, hover-focus splits, themed Dock icon.

# ── Font ──────────────────────────────────────────────────────────────
# font-thicken is macOS-only (Core Text). Linux gets weight via
# freetype-load-flags in os-linux.conf.
font-thicken = true
# Retina-comfort size per the 2026-07-18 experience spec (validated 12-14;
# 14 felt oversized, 10 was BD790i-parity dense). This layer loads AFTER the
# shared base (10pt), so it wins on macOS only. The 140x52 cell grid is
# font-independent — dashboards still fit. Reload: cmd+shift+r; window size
# applies to NEW windows.
font-size = 13

# ── Titlebar / window chrome ──────────────────────────────────────────
# `native` = standard macOS titlebar + real NSWindow tabs: per-tab close ×,
# the + new-tab button, and the tab-overview control all work. `tabs` (tried
# 2026-07, reverted per the experience-overhaul spec's fallback clause) draws
# a custom SwiftUI strip in the titlebar that on 1.3.1 renders no close/+
# controls and miscounts tabs top-right. Other values: transparent | hidden.
# Applies to NEW windows only — fully restart Ghostty after changing.
# Pairs with the cross-platform `window-decoration = true`.
macos-titlebar-style = native
macos-window-shadow = true
# The path proxy icon in the titlebar is redundant (progress.zsh already puts
# cwd in the title) — hide it for a cleaner bar.
macos-titlebar-proxy-icon = hidden
# Treat ⌥ as Alt so Meta-keybinds (e.g. word-wise motion) reach the shell
# instead of inserting accented characters.
macos-option-as-alt = true

# ── Appearance — glass restored (operator pick 2026-08-17) ────────────
# The 1.0 solid-opacity override existed only as a macOS 27 BETA workaround
# (transparent titlebar/tab chrome on the non-opaque path). Base 0.93 opacity
# is inherited again, with compositor blur behind it for the glass look.
# IF the titlebar/tabs ever render invisible again after an OS update:
# uncomment the next line and reload — that's the whole revert.
# background-opacity = 1.0
background-blur = 20

# ── Fullscreen (operator pick 2026-08-17) ─────────────────────────────
# Non-native fullscreen: instant (no Spaces slide animation), menu bar stays
# reachable on hover. `visible-menu` keeps the menu bar visible entirely —
# drop to `true` for edge-to-edge cells.
macos-non-native-fullscreen = visible-menu
keybind = cmd+enter=toggle_fullscreen

# ── Split focus (operator pick 2026-08-17) ────────────────────────────
# Hover moves focus between splits — glance-and-type across panes without a
# click (pairs with unfocused-split-opacity in the base for a clear cue).
focus-follows-mouse = true

# ── Dock icon — Open Claw palette (operator pick 2026-08-17) ──────────
# Tint the Ghostty ghost with the claw blue on the GitHub-dark screen so the
# Dock icon matches the terminal it opens. `custom-style` replaces the stock
# icon at app launch (relaunch Ghostty to see it).
macos-icon = custom-style
macos-icon-ghost-color = #58a6ff
macos-icon-screen-color = #0d1117

# ── Secure input (pinned) ─────────────────────────────────────────────
# Auto-enable macOS secure keyboard entry while a password prompt is active,
# and show the indicator when any app holds secure input (explains "why are
# my keybinds dead"). Both are Ghostty defaults — pinned here so the security
# posture is explicit and survives upstream default changes.
macos-auto-secure-input = true
macos-secure-input-indication = true

# ── Quick terminal (drop-down, Guake/Yakuake-style) ───────────────────
# macOS-only in Ghostty 1.3.1 — the GTK build rejects `toggle_quick_terminal`,
# so this whole feature was dead weight (and commented out) in the old shared
# config. Isolated here, the keybind can finally be LIVE.
quick-terminal-position = top
quick-terminal-animation-duration = 0.15
quick-terminal-autohide = true
# global:ctrl+backquote, NOT cmd+backquote — ⌘` is macOS's native "cycle windows
# of the front app" and hijacking it globally broke window management everywhere.
keybind = global:ctrl+backquote=toggle_quick_terminal
