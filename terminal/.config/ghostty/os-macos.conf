# Ghostty — macOS-only layer.
# Loaded via `config-file = ?os-active.conf`, where os-active.conf is a symlink
# → this file, set by scripts/setup/symlinks.sh on Darwin hosts. Everything
# here is rejected or a no-op on the GTK/Linux build, which is exactly why it's
# quarantined out of the shared base config.

# ── Font ──────────────────────────────────────────────────────────────
# font-thicken is macOS-only (Core Text). Linux gets weight via
# freetype-load-flags in os-linux.conf.
font-thicken = true
# No font-size override: macOS inherits the base 10pt — parity with the
# BD790i standard (os-linux.conf doesn't override either). This layer loads
# AFTER the shared base, so a `font-size = N` here would win if a per-panel
# bump is ever wanted again (tried 14pt 2026-07, reverted); reload with
# cmd+shift+r after tuning.

# ── Titlebar / window chrome ──────────────────────────────────────────
# `native` = standard macOS titlebar + real NSWindow tabs: per-tab close ×,
# the + new-tab button, and the tab-overview control all work. `tabs` (tried
# 2026-07, reverted per the experience-overhaul spec's fallback clause) draws
# a custom SwiftUI strip in the titlebar that on 1.3.1 renders no close/+
# controls and miscounts tabs top-right. Other values: transparent | hidden.
# Applies to NEW windows only — fully restart Ghostty after changing.
# Pairs with the cross-platform `window-decoration = true`.
macos-titlebar-style = native
macos-window-shadow = true
# Treat ⌥ as Alt so Meta-keybinds (e.g. word-wise motion) reach the shell
# instead of inserting accented characters.
macos-option-as-alt = true

# ── Quick terminal (drop-down, Guake/Yakuake-style) ───────────────────
# macOS-only in Ghostty 1.3.1 — the GTK build rejects `toggle_quick_terminal`,
# so this whole feature was dead weight (and commented out) in the old shared
# config. Isolated here, the keybind can finally be LIVE.
quick-terminal-position = top
quick-terminal-animation-duration = 0.15
quick-terminal-autohide = true
# global:ctrl+backquote, NOT cmd+backquote — ⌘` is macOS's native "cycle windows
# of the front app" and hijacking it globally broke window management everywhere.
keybind = global:ctrl+backquote=toggle_quick_terminal
