# Ghostty — macOS-only layer.
# Loaded via `config-file = ?os-active.conf`, where os-active.conf is a symlink
# → this file, set by scripts/setup/symlinks.sh on Darwin hosts. Everything
# here is rejected or a no-op on the GTK/Linux build, which is exactly why it's
# quarantined out of the shared base config.

# ── Font ──────────────────────────────────────────────────────────────
# font-thicken is macOS-only (Core Text). Linux gets weight via
# freetype-load-flags in os-linux.conf.
font-thicken = true

# ── Titlebar / window chrome ──────────────────────────────────────────
# `tabs` integrates the tab strip into the titlebar — a proper draggable
# header with native macOS tab management, the closest match to the BD790i's
# GTK titlebar + top tab strip. (Was `hidden`, which gave a borderless
# floating panel with no header or tabs.) Other values: native | transparent.
# Pairs with the cross-platform `window-decoration = true`.
macos-titlebar-style = tabs
macos-window-shadow = true
# Treat ⌥ as Alt so Meta-keybinds (e.g. word-wise motion) reach the shell
# instead of inserting accented characters.
macos-option-as-alt = true

# ── Quick terminal (drop-down, Guake/Yakuake-style) ───────────────────
# macOS-only in Ghostty 1.3.1 — the GTK build rejects `toggle_quick_terminal`,
# so this whole feature was dead weight (and commented out) in the old shared
# config. Isolated here, the keybind can finally be LIVE.
quick-terminal-position = top
quick-terminal-animation-duration = 0.15
quick-terminal-autohide = true
keybind = global:cmd+backquote=toggle_quick_terminal
