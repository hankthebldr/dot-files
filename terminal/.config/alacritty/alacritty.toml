# Alacritty — cross-platform (macOS + Linux)
# Theme: GitHub macOS Dark  (per dot-files CLAUDE.md)
# Font:  JetBrainsMono Nerd Font Mono @ 14pt
# Keys:  Mac-style — ⌘ on macOS, Super on Linux (mods = "Super")

[font]
size = 14.0

[font.normal]
family = "JetBrainsMono Nerd Font Mono"
style  = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font Mono"
style  = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font Mono"
style  = "Italic"

[font.offset]
y = 2

[window]
decorations  = "Buttonless"
opacity      = 0.97
blur         = true
startup_mode = "Windowed"
dynamic_title = true

[window.padding]
x = 12
y = 12

[window.dimensions]
columns = 140
lines   = 42

# macOS: treat Option as Alt (ignored on Linux)
[window.option_as_alt]
both = "Both"

[scrolling]
history    = 50000
multiplier = 3

[selection]
save_to_clipboard = true

[cursor]
style.shape     = "Beam"
style.blinking  = "On"
unfocused_hollow = true

[env]
TERM = "xterm-256color"

# ── Colors: GitHub macOS Dark ────────────────────────────────────────
[colors.primary]
background = "#0d1117"
foreground = "#c9d1d9"

[colors.cursor]
text   = "#0d1117"
cursor = "#58a6ff"

[colors.selection]
text       = "#c9d1d9"
background = "#264f78"

[colors.normal]
black   = "#484f58"
red     = "#ff7b72"
green   = "#3fb950"
yellow  = "#d29922"
blue    = "#58a6ff"
magenta = "#bc8cff"
cyan    = "#39c5cf"
white   = "#b1bac4"

[colors.bright]
black   = "#6e7681"
red     = "#ffa198"
green   = "#56d364"
yellow  = "#e3b341"
blue    = "#79c0ff"
magenta = "#d2a8ff"
cyan    = "#56d4dd"
white   = "#f0f6fc"

# ── Keys ──────────────────────────────────────────────────────────────
# On macOS "Command" = ⌘. On Linux "Super" = Win/⌘-equivalent.
# Alacritty TOML doesn't let one binding cover both, so we list both.
[keyboard]
bindings = [
  # macOS — ⌘
  { key = "C", mods = "Command",       action = "Copy" },
  { key = "V", mods = "Command",       action = "Paste" },
  { key = "X", mods = "Command",       action = "Copy" },
  { key = "Q", mods = "Command",       action = "Quit" },
  { key = "N", mods = "Command",       action = "SpawnNewInstance" },
  { key = "K", mods = "Command",       action = "ClearHistory" },
  { key = "F", mods = "Command",       action = "SearchForward" },
  { key = "Plus",  mods = "Command",   action = "IncreaseFontSize" },
  { key = "Minus", mods = "Command",   action = "DecreaseFontSize" },
  { key = "Key0",  mods = "Command",   action = "ResetFontSize" },

  # Linux — Super (Win key)
  { key = "C", mods = "Super",         action = "Copy" },
  { key = "V", mods = "Super",         action = "Paste" },
  { key = "X", mods = "Super",         action = "Copy" },
  { key = "Q", mods = "Super",         action = "Quit" },
  { key = "N", mods = "Super",         action = "SpawnNewInstance" },
  { key = "K", mods = "Super",         action = "ClearHistory" },
  { key = "F", mods = "Super",         action = "SearchForward" },
  { key = "Plus",  mods = "Super",     action = "IncreaseFontSize" },
  { key = "Minus", mods = "Super",     action = "DecreaseFontSize" },
  { key = "Key0",  mods = "Super",     action = "ResetFontSize" },

  # Linux convention fallback
  { key = "C", mods = "Control|Shift", action = "Copy" },
  { key = "V", mods = "Control|Shift", action = "Paste" },
]
