# Alacritty Configuration — Open Claw (GitHub Dark)
# Sized for the welcome TUI + profile fastfetch flow.

[font]
size = 13.0

[font.normal]
family = "JetBrainsMono Nerd Font Mono"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font Mono"
style = "Italic"

[window]
decorations = "Buttonless"
opacity = 0.95
blur = true
startup_mode = "Windowed"
dynamic_title = true

[window.padding]
x = 10
y = 10

# 160×50 gives the welcome TUI + fastfetch flow margin to render
# without scrolling. Drop to 140×40 only on small displays.
[window.dimensions]
columns = 160
lines = 50

[scrolling]
history = 10000
multiplier = 3

[selection]
save_to_clipboard = true

[cursor]
style = "Block"
unfocused_hollow = true

[env]
TERM = "xterm-256color"

# macOS Specifics
[window.option_as_alt]
both = "Both"   # Treat both Option keys as Alt

# ── GitHub Dark palette (matches dotfiles identity) ──
[colors.primary]
background = "#0d1117"
foreground = "#c9d1d9"

[colors.cursor]
text   = "#0d1117"
cursor = "#58a6ff"

[colors.selection]
text       = "#0d1117"
background = "#58a6ff"

[colors.normal]
black   = "#484f58"
red     = "#ff7b72"
green   = "#3fb950"
yellow  = "#d29922"
blue    = "#58a6ff"
magenta = "#bc8cff"
cyan    = "#39c5cf"
white   = "#b1bac4"

[colors.bright]
black   = "#6e7681"
red     = "#ffa198"
green   = "#56d364"
yellow  = "#e3b341"
blue    = "#79c0ff"
magenta = "#d2a8ff"
cyan    = "#56d4dd"
white   = "#f0f6fc"

[keyboard]
bindings = [
  { key = "V", mods = "Command", action = "Paste" },
  { key = "C", mods = "Command", action = "Copy" },
  { key = "Q", mods = "Command", action = "Quit" },
  { key = "N", mods = "Command", action = "SpawnNewInstance" },
]
