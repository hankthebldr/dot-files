# Kitty Configuration — Open Claw (GitHub Dark)
# Sized for the welcome TUI + profile fastfetch flow.

# ── Font ─────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0
disable_ligatures never

# ── Window ───────────────────────────────────────────────
# 160c × 50r is the Open Claw target: leaves >5 rows of margin above
# the welcome TUI menu + profile fastfetch dashboard so nothing crops.
hide_window_decorations titlebar-only
window_padding_width 10
placement_strategy center
remember_window_size  no
initial_window_width  160c
initial_window_height 50c

# ── macOS Specifics ──────────────────────────────────────
macos_option_as_alt yes
macos_quit_when_last_window_closed yes
macos_window_resizable yes
macos_thicken_font 0.5
macos_custom_beam_cursor yes

# ── Visual Bell ──────────────────────────────────────────
enable_audio_bell no
visual_bell_duration 0.0

# ── Color Scheme: GitHub Dark (matches CLAUDE.md palette) ──
background_opacity 0.95
background_blur 20
background #0d1117
foreground #c9d1d9
selection_foreground #0d1117
selection_background #58a6ff
url_color #58a6ff
cursor #58a6ff
cursor_text_color #0d1117

# Black
color0  #484f58
color8  #6e7681

# Red (#ff7b72)
color1  #ff7b72
color9  #ffa198

# Green (#3fb950)
color2  #3fb950
color10 #56d364

# Yellow (#d29922)
color3  #d29922
color11 #e3b341

# Blue (#58a6ff)
color4  #58a6ff
color12 #79c0ff

# Magenta (#bc8cff)
color5  #bc8cff
color13 #d2a8ff

# Cyan (#39c5cf)
color6  #39c5cf
color14 #56d4dd

# White
color7  #b1bac4
color15 #f0f6fc

# ── Key Bindings ─────────────────────────────────────────
map cmd+c        copy_to_clipboard
map cmd+v        paste_from_clipboard
map shift+insert paste_from_clipboard

# ── Tab Bar (GitHub Dark themed) ─────────────────────────
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
active_tab_foreground   #0d1117
active_tab_background   #58a6ff
active_tab_font_style   bold
inactive_tab_foreground #8b949e
inactive_tab_background #161b22
inactive_tab_font_style normal
