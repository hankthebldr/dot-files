# Kitty — cross-platform config (macOS + Linux)
# Theme: GitHub macOS Dark  (per dot-files CLAUDE.md)
# Font:  JetBrainsMono Nerd Font Mono @ 14pt
# Keys:  Mac-style — kitty_mod = cmd on macOS, super on Linux

# ── Font ──────────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0
disable_ligatures never
modify_font cell_height 110%

# ── Window ────────────────────────────────────────────────────────────
hide_window_decorations titlebar-only
window_padding_width 12
placement_strategy center
remember_window_size  yes
initial_window_width  1200
initial_window_height 750
confirm_os_window_close 0

# ── Platform-specific (each side ignored on the other) ───────────────
# macOS
macos_option_as_alt yes
macos_quit_when_last_window_closed yes
macos_window_resizable yes
macos_thicken_font 0.5
macos_custom_beam_cursor yes
# Linux
linux_display_server auto

# ── Bell ──────────────────────────────────────────────────────────────
enable_audio_bell no
visual_bell_duration 0.0

# ── Cursor & mouse ────────────────────────────────────────────────────
cursor_shape beam
cursor_blink_interval 0.5
mouse_hide_wait 1.0
copy_on_select clipboard

# ── Colors — GitHub macOS Dark ────────────────────────────────────────
background_opacity 0.97
background_blur 20
foreground #c9d1d9
background #0d1117
selection_foreground #c9d1d9
selection_background #264f78
url_color #58a6ff
cursor #58a6ff

# normal
color0 #484f58
color1 #ff7b72
color2 #3fb950
color3 #d29922
color4 #58a6ff
color5 #bc8cff
color6 #39c5cf
color7 #b1bac4
# bright
color8  #6e7681
color9  #ffa198
color10 #56d364
color11 #e3b341
color12 #79c0ff
color13 #d2a8ff
color14 #56d4dd
color15 #f0f6fc

# ── Tab bar ───────────────────────────────────────────────────────────
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
active_tab_foreground   #0d1117
active_tab_background   #58a6ff
active_tab_font_style   bold
inactive_tab_foreground #8b949e
inactive_tab_background #161b22
inactive_tab_font_style normal

# ── Keybindings ───────────────────────────────────────────────────────
# kitty_mod = cmd on macOS, super on Linux (both = ⌘-equivalent).
kitty_mod cmd

# Clipboard (Mac-style)
map cmd+c        copy_to_clipboard
map cmd+v        paste_from_clipboard
map cmd+x        copy_to_clipboard
map shift+insert paste_from_clipboard
# Also accept the Linux convention
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Tabs
map cmd+t        new_tab_with_cwd
map cmd+w        close_tab
map cmd+shift+]  next_tab
map cmd+shift+[  previous_tab
map cmd+1        goto_tab 1
map cmd+2        goto_tab 2
map cmd+3        goto_tab 3
map cmd+4        goto_tab 4
map cmd+5        goto_tab 5
map cmd+6        goto_tab 6
map cmd+7        goto_tab 7
map cmd+8        goto_tab 8
map cmd+9        goto_tab 9

# Windows / splits
map cmd+n        new_os_window
map cmd+shift+n  launch --location=vsplit --cwd=current
map cmd+shift+d  launch --location=hsplit --cwd=current
map cmd+shift+enter toggle_layout stack
map cmd+shift+h  neighboring_window left
map cmd+shift+l  neighboring_window right
map cmd+shift+k  neighboring_window up
map cmd+shift+j  neighboring_window down

# Font size
map cmd+equal    change_font_size all +1.0
map cmd+minus    change_font_size all -1.0
map cmd+0        change_font_size all 0

# Misc
map cmd+k        clear_terminal scroll active
map cmd+f        show_scrollback
map cmd+q        quit
map cmd+comma    edit_config_file
map cmd+shift+r  load_config_file
