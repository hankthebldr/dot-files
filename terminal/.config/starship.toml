# Starship Prompt Configuration — UNUSED / ALTERNATE PROMPT.
# The active zsh prompt is Powerlevel10k (shell/.p10k.zsh, wired in shell/.zshrc);
# starship is NOT sourced anywhere, so editing this file changes nothing as-is.
# Kept as a ready-to-go alternate. To switch: remove the p10k init from .zshrc and
# add `eval "$(starship init zsh)"`. This file stows to ~/.config/starship.toml.

# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = true

# Timeout for commands executed by starship (in milliseconds)
command_timeout = 500

# Format string
format = """
[╭─](bold green)$username$hostname$directory$git_branch$git_status$git_state
[╰─](bold green)$character"""

# Right-side prompt
right_format = """$cmd_duration$all"""

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[✗](bold red)"

[username]
style_user = "bold blue"
style_root = "bold red"
format = "[$user]($style) "
disabled = false
show_always = true


[hostname]
ssh_only = false
format = "on [$hostname](bold blue) "
disabled = false

[directory]
truncation_length = 3
truncate_to_repo = true
format = "in [$path]($style)[$read_only]($read_only_style) "
style = "bold cyan"
read_only = " 🔒"
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
"Projects" = "󰲋 "

[git_branch]
symbol = " "
format = "on [$symbol$branch(:$remote_branch)]($style) "
style = "bold purple"

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "bold red"
conflicted = "🏳"
up_to_date = "✓"
untracked = "🤷"
ahead = "⇡${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
behind = "⇣${count}"
stashed = "📦"
modified = "📝"
staged = '[++\($count\)](green)'
renamed = "👅"
deleted = "🗑"

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = "[🍒 PICKING](bold red)"

[cmd_duration]
min_time = 500
format = "took [$duration](bold yellow) "

[time]
disabled = false
format = '🕙[\[ $time \]]($style) '
time_format = "%T"
style = "bold white"

# Language-specific modules

[nodejs]
symbol = " "
format = "via [$symbol($version )]($style)"
detect_files = ["package.json", ".node-version"]
style = "bold green"

[python]
symbol = " "
format = 'via [${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
style = "bold yellow"

[rust]
symbol = " "
format = "via [$symbol($version )]($style)"
style = "bold red"

[golang]
symbol = " "
format = "via [$symbol($version )]($style)"
style = "bold cyan"

[java]
symbol = " "
format = "via [$symbol($version )]($style)"
style = "bold red"

[ruby]
symbol = " "
format = "via [$symbol($version )]($style)"
style = "bold red"

[php]
symbol = " "
format = "via [$symbol($version )]($style)"
style = "bold purple"

[elixir]
symbol = " "
format = 'via [$symbol($version \(OTP $otp_version\) )]($style)'
style = "bold purple"

[lua]
symbol = " "
format = "via [$symbol($version )]($style)"
style = "bold blue"

# Cloud & DevOps

[docker_context]
symbol = " "
format = "via [$symbol$context]($style) "
style = "bold blue"
only_with_files = true

[kubernetes]
format = 'on [⛵ ($user on )($cluster in )$context \($namespace\)](dimmed green) '
disabled = false
detect_files = ['k8s', 'Dockerfile']
detect_extensions = ['yaml', 'yml']

[kubernetes.context_aliases]
"dev.local.cluster.k8s" = "dev"
".*/openshift-cluster/.*" = "openshift"
"gke_.*_(?P<var_cluster>[\\w-]+)" = "gke-$var_cluster"

[terraform]
symbol = "💠 "
format = "via [$symbol$workspace]($style) "
style = "bold purple"

[aws]
symbol = "  "
format = 'on [$symbol($profile )(\($region\) )(\[$duration\] )]($style)'
style = "bold yellow"

[gcloud]
symbol = "☁️  "
format = 'on [$symbol$account(@$domain)(\($region\))]($style) '
style = "bold blue"

[azure]
symbol = "󰠅 "
format = "on [$symbol($subscription)]($style) "
style = "bold blue"

# Package managers

[package]
symbol = "📦 "
format = "is [$symbol$version]($style) "
style = "bold cyan"

[helm]
symbol = "⎈ "
format = "via [$symbol($version )]($style)"
style = "bold white"

# Databases

[redis]
symbol = " "
format = "via [$symbol($version )]($style)"
style = "bold red"

# System

[memory_usage]
disabled = false
threshold = 75
symbol = " "
format = "via $symbol[$ram( | $swap)]($style) "
style = "bold dimmed white"

[battery]
full_symbol = "🔋"
charging_symbol = "⚡️"
discharging_symbol = "💀"
unknown_symbol = "❓"
empty_symbol = "🪫"

[[battery.display]]
threshold = 10
style = "bold red"

[[battery.display]]
threshold = 30
style = "bold yellow"

[status]
style = "bold red"
symbol = "🔴"
format = '[\[$symbol $status\]]($style) '
disabled = false

[os]
disabled = false
format = "on [($name )]($style)"

[os.symbols]
Macos = " "
Ubuntu = " "
Debian = " "
Fedora = " "
Arch = "󰣇 "
