[package]
name = "claw-tui"
version = "0.1.0"
edition = "2021"
description = "Open Claw ratatui front-end — renders + selects; zsh applies."

[[bin]]
name = "claw-tui"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
