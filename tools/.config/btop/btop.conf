# btop — dark theme matching the terminal palette. Stows to ~/.config/btop/btop.conf.
# gruvbox_dark ships as a built-in btop theme; theme_background=False inherits the
# terminal's (GitHub-dark/gruvbox) background instead of painting its own.
color_theme = "gruvbox_dark"
theme_background = False
truecolor = True
vim_keys = True

# Process view: tree (handy for K3s / container process hierarchies on the homelab).
proc_tree = True
proc_per_core = False

# Crisp braille graphs; a calmer refresh rate.
graph_symbol = "braille"
update_ms = 1500
