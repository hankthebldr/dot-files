# LiteLLM — unified OpenAI-compatible gateway in front of ollama, vLLM,
# llama-swap and cloud providers. Managed by `claw ai-services`.
#
#   Gateway:  http://localhost:4000  (OpenAI-compatible /v1)
#   Config:   ./config.yaml  (model_list + routing)
#   Backends: host ollama :11434, llama-swap :8090, vLLM :8000 — reached via
#             host.docker.internal (the container itself needs no GPU).
#
# OPSEC: image pinned to a specific version (NOT a moving :main-stable tag).
# LiteLLM had a PyPI supply-chain compromise in 2026-03 (v1.82.7/1.82.8);
# v1.89.2 is well past it. Bump deliberately, re-verify, don't float.
services:
  litellm:
    image: ghcr.io/berriai/litellm:v1.89.2
    container_name: litellm
    restart: unless-stopped
    ports:
      - "4000:4000"
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      # Clients must send this as the Bearer key. Override in ~/.dotfiles/.env.
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-local-changeme}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
