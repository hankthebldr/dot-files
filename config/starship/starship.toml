# Starship Prompt Configuration
# GitHub Dark macOS Aesthetic for Open Claw CLI
# Docs: https://starship.rs/config/

# Wait 10ms for starship to check files
scan_timeout = 10

# Insert a blank line between shell prompts
add_newline = true

# Prompt format
format = """
$directory\
$git_branch\
$git_status\
$kubernetes\
$aws\
$gcloud\
$terraform\
$docker_context\
$python\
$nodejs\
$golang\
$rust\
$java\
$cmd_duration\
$line_break\
$character"""

# ── Directory ──
[directory]
style = "bold #58a6ff"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 🔒"
read_only_style = "#ff7b72"

# ── Git Branch ──
[git_branch]
symbol = " "
style = "bold #bc8cff"
format = "on [$symbol$branch(:$remote_branch)]($style) "

# ── Git Status ──
[git_status]
style = "#d29922"
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = "⚠"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "📦"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

# ── Character (prompt symbol) ──
[character]
success_symbol = "[❯](bold #3fb950)"
error_symbol = "[❯](bold #ff7b72)"
vimcmd_symbol = "[❮](bold #d29922)"

# ── Command Duration ──
[cmd_duration]
min_time = 2_000
style = "#8b949e"
format = "took [$duration]($style) "

# ── Kubernetes ──
[kubernetes]
disabled = false
format = 'on [⎈ $context(\($namespace\))]($style) '
style = "#58a6ff"
detect_files = ["k8s", "Dockerfile", "docker-compose.yml"]

[kubernetes.context_aliases]
"docker-desktop" = "docker"

# ── AWS ──
[aws]
format = 'on [$symbol($profile )(\($region\))]($style) '
symbol = "☁️ "
style = "#d29922"

# ── GCloud ──
[gcloud]
format = 'on [$symbol$project]($style) '
symbol = "🔷 "
style = "#58a6ff"
disabled = true

# ── Terraform ──
[terraform]
format = 'via [$symbol$workspace]($style) '
symbol = "💠 "
style = "#bc8cff"

# ── Docker Context ──
[docker_context]
format = 'via [$symbol$context]($style) '
symbol = "🐳 "
style = "#58a6ff"
only_with_files = true

# ── Python ──
[python]
format = 'via [$symbol$version(\($virtualenv\))]($style) '
symbol = "🐍 "
style = "#d29922"

# ── Node.js ──
[nodejs]
format = 'via [$symbol$version]($style) '
symbol = " "
style = "#3fb950"

# ── Go ──
[golang]
format = 'via [$symbol$version]($style) '
symbol = "🐹 "
style = "#58a6ff"

# ── Rust ──
[rust]
format = 'via [$symbol$version]($style) '
symbol = "🦀 "
style = "#ff7b72"

# ── Java ──
[java]
format = 'via [$symbol$version]($style) '
symbol = "☕ "
style = "#d29922"
disabled = true
