# HR-TRUST homelab fleet inventory — read by scripts/utils/situation.sh probe_homelab().
# Machine-local override: $XDG_CONFIG_HOME/claw/fleet.yml (untracked) wins if present.
# Adding a box or service is data here — no code change.
# Service kinds: native | ssh | http | tcp | kube | dns.
fleet:
  name: HR-TRUST
  poll_seconds: 60

# k8s cluster context + the Traefik entrypoint used for Host-header service probes
# (DNS-independent — works on-LAN or over a routed tailnet).
cluster:
  context: k3s-ms01
  traefik_ip: 192.168.1.110

machines:
  - { id: ms-01,  host: 192.168.1.110, user: henry, ssh: true,  role: control-plane,
      services: [k3s, gitea, n8n, portainer, enclave, grafana, harbor] }
  - { id: r630,   host: 192.168.1.102, user: henry, ssh: true,  role: worker, services: [] }
  - { id: bd790i, host: 192.168.1.104, user: henry, ssh: true,  role: worker,
      services: [docker, ollama, tailscale] }
  - { id: pihole, host: 192.168.1.101, user: henry, ssh: false, role: dns,
      services: [pihole-dns] }

services:
  # apps — probed via Traefik Host header against cluster.traefik_ip
  gitea:      { kind: http, group: apps,  glyph: "",       host: git.lab.local }
  n8n:        { kind: http, group: apps,  glyph: "",       host: n8n.lab.local }
  portainer:  { kind: http, group: apps,  glyph: "", host: portainer.lab.local }
  enclave:    { kind: http, group: apps,  glyph: "",   host: enclave.lab.local }
  grafana:    { kind: http, group: apps,  glyph: "",   host: grafana.lab.local }
  harbor:     { kind: http, group: apps,  glyph: "",    host: harbor.lab.local, planned: true }
  # infra
  k3s:        { kind: kube,   group: infra, glyph: "󱃾",     context: k3s-ms01 }
  docker:     { kind: ssh,    group: infra, glyph: "",  cmd: "docker ps -q | wc -l" }
  ollama:     { kind: http,   group: infra, glyph: "",  host: bd790i, port: 11434, health: /api/tags }
  tailscale:  { kind: native, group: infra, glyph: "" }
  # dns
  pihole-dns: { kind: dns,    group: dns,   glyph: "",  server: 192.168.1.101, dns_probe: git.lab.local }

identity:
  github: { kind: gh }
