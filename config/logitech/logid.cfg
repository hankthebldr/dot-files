// logid.cfg — logiops daemon config for the Logitech MX Vertical.
// Canonical copy lives in the dotfiles repo; deploy it to /etc/logid.cfg
// (symlink or copy) so `logid.service` picks it up. See config/logitech/README.md.
//
// Verify the device NAME logid actually sees (it matches on HID++ name, which
// can differ from the kernel input name):  sudo logid -v   ← look for "Device ... name"
// then adjust `name:` below if it prints something other than "MX Vertical".
//
// NOTE: the MX Vertical has NO electromagnetic free-spin wheel, so there is no
// `smartshift` block here (that's an MX Master feature).

devices: (
{
    name: "MX Vertical";

    // Pointer speed. MX Vertical hardware range is 400–4000 DPI.
    dpi: 1600;

    buttons: (
        // ── Examples (commented) — uncomment + edit to remap. ───────────────
        // Find a button's CID with:  sudo logid -v  then press the button.
        //
        // Make the top "cursor-speed" button a middle-click instead:
        // { cid: 0xc4; action = { type: "Keypress"; keys: ["BTN_MIDDLE"]; }; },
        //
        // Thumb gesture button → workspace/desktop switching (hold + move):
        // { cid: 0xc3; action = {
        //     type: "Gestures";
        //     gestures: (
        //       { direction: "Up";    mode: "OnRelease"; action = { type:"Keypress"; keys:["KEY_LEFTMETA","KEY_UP"]; }; },
        //       { direction: "Down";  mode: "OnRelease"; action = { type:"Keypress"; keys:["KEY_LEFTMETA","KEY_DOWN"]; }; },
        //       { direction: "Left";  mode: "OnRelease"; action = { type:"Keypress"; keys:["KEY_LEFTMETA","KEY_LEFT"]; }; },
        //       { direction: "Right"; mode: "OnRelease"; action = { type:"Keypress"; keys:["KEY_LEFTMETA","KEY_RIGHT"]; }; },
        //       { direction: "None";  mode: "OnRelease"; action = { type:"Keypress"; keys:["KEY_LEFTMETA"]; }; }
        //     );
        //   };
        // }
    );
}
);
