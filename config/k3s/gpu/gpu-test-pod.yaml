# GPU smoke-test pod — proves the cluster can schedule a pod onto the Blackwell
# node and reach the GPU. Runs `nvidia-smi` once and exits.
#   kubectl apply -f config/k3s/gpu/gpu-test-pod.yaml
#   kubectl logs gpu-smoke-test          # should print the GPU table
#   kubectl delete pod gpu-smoke-test
apiVersion: v1
kind: Pod
metadata:
  name: gpu-smoke-test
spec:
  restartPolicy: Never
  runtimeClassName: nvidia
  nodeSelector:
    nvidia.com/gpu.present: "true"
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  containers:
    - name: cuda
      image: nvidia/cuda:12.8.0-base-ubuntu22.04
      command: ["nvidia-smi"]
      resources:
        limits:
          nvidia.com/gpu: 1
