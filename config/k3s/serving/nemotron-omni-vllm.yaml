# On-cluster Nemotron 3 Nano Omni served by vLLM, scheduled onto the Blackwell
# GPU node. Mirrors config/ai/serve-nemotron-omni.sh but as a K8s Deployment.
#
# Prereqs (run from the K3s server):
#   1. GPU node enabled:  scripts/utils/k3s-gpu-enable.sh --test
#   2. HF token secret:   kubectl create secret generic hf-token \
#                           --from-literal=token=hf_xxx -n ai-serving
#   3. Apply this file:   kubectl apply -f config/k3s/serving/nemotron-omni-vllm.yaml
#   4. Watch rollout:     kubectl -n ai-serving rollout status deploy/nemotron-omni
#   5. Smoke test:        kubectl -n ai-serving port-forward svc/nemotron-omni 8000:8000
#                         curl localhost:8000/v1/models
#
# ⚠ VRAM: the 24GB RTX PRO 4000 needs the NVFP4 variant (FP8 ≈ 30GB won't fit).
#   Edit MODEL below if the NVFP4 repo id differs / isn't published yet.
---
apiVersion: v1
kind: Namespace
metadata:
  name: ai-serving
---
# Persistent cache for HuggingFace weights (uses k3s' default local-path SC).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hf-cache
  namespace: ai-serving
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 80Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nemotron-omni
  namespace: ai-serving
  labels: { app: nemotron-omni }
spec:
  replicas: 1
  selector:
    matchLabels: { app: nemotron-omni }
  template:
    metadata:
      labels: { app: nemotron-omni }
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        nvidia.com/gpu.present: "true"
      # Tolerate the optional dedicate-to-GPU taint from k3s-gpu-enable.sh --taint
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: vllm
          # CUDA 13 image (driver R580+ required — the node has it). For CUDA 12.9
          # hosts use vllm/vllm-openai:v0.20.0-cu129 instead.
          image: vllm/vllm-openai:v0.20.0
          env:
            - name: MODEL
              value: nvidia/Nemotron-3-Nano-Omni-30B-A3B-Reasoning-NVFP4
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef: { name: hf-token, key: token }
            - name: HF_HOME
              value: /cache/hf
          # Flags match the launcher, incl. the RTX-Pro FlashInfer workaround.
          command: ["/bin/sh", "-c"]
          args:
            - >
              vllm serve "$MODEL"
              --host 0.0.0.0 --port 8000
              --tensor-parallel-size 1
              --max-model-len 131072
              --trust-remote-code
              --quantization modelopt
              --reasoning-parser nemotron_v3
              --enable-auto-tool-choice --tool-call-parser qwen3_coder
              --kv-cache-dtype fp8
              --moe-backend triton
              --video-pruning-rate 0.5
          ports:
            - { name: http, containerPort: 8000 }
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - { name: hf-cache, mountPath: /cache }
            - { name: dshm, mountPath: /dev/shm }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 120
            periodSeconds: 15
            failureThreshold: 40        # weights download can be slow on first boot
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 600
            periodSeconds: 30
      volumes:
        - name: hf-cache
          persistentVolumeClaim: { claimName: hf-cache }
        - name: dshm           # vLLM needs a large /dev/shm for tensor IPC
          emptyDir: { medium: Memory, sizeLimit: 8Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: nemotron-omni
  namespace: ai-serving
spec:
  selector: { app: nemotron-omni }
  ports:
    - { name: http, port: 8000, targetPort: 8000 }
  type: ClusterIP
